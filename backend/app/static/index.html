<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LetMeFit API Test</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #18202a;
        --muted: #5d6a78;
        --line: #d9dee6;
        --primary: #1769e0;
        --primary-dark: #1051af;
        --danger: #b42318;
        --ok: #157f3b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      main,
      .bar {
        width: min(1380px, calc(100vw - 32px));
        margin: 0 auto;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 68px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(420px, 0.8fr);
        gap: 16px;
        padding: 18px 0 28px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 10px;
        color: var(--text);
        background: #fff;
        font: inherit;
      }

      label.checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        font-size: 13px;
      }

      label.checkbox input {
        width: auto;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 9px 12px;
        color: #fff;
        background: var(--primary);
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: var(--primary-dark);
      }

      button.secondary {
        color: var(--text);
        background: #eef2f7;
      }

      button.secondary:hover {
        background: #e3e8ef;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .bar .actions {
        margin-top: 0;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 10px;
        color: var(--muted);
        background: #fff;
      }

      .pill.ok {
        color: var(--ok);
      }

      .pill.warn {
        color: var(--danger);
      }

      pre {
        min-height: 300px;
        max-height: 520px;
        margin: 0;
        overflow: auto;
        border-radius: 8px;
        padding: 12px;
        color: #dce7f7;
        background: #111827;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .state {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .state code {
        color: var(--muted);
        word-break: break-all;
      }

      .output-stack {
        display: grid;
        gap: 16px;
      }

      .chat-panel,
      .pending-panel {
        margin-top: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfe;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 10px 12px;
      }

      .panel-title {
        font-weight: 700;
      }

      .chat-list {
        display: grid;
        gap: 10px;
        max-height: 380px;
        overflow: auto;
        padding: 12px;
      }

      .message {
        display: grid;
        gap: 4px;
        max-width: 86%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px;
        background: #fff;
      }

      .message.user {
        justify-self: end;
        border-color: #c8d8f3;
        background: #eef5ff;
      }

      .message.assistant {
        justify-self: start;
      }

      .message.has-debug {
        cursor: pointer;
      }

      .message.has-debug:hover {
        border-color: var(--primary);
      }

      .message-role {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .message-text {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .empty-note {
        color: var(--muted);
        padding: 12px;
      }

      .pending-list {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .pending-card {
        display: grid;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #fff;
      }

      .pending-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .pending-title {
        font-weight: 700;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .kv-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px 10px;
      }

      .kv {
        color: var(--muted);
        font-size: 12px;
      }

      .kv strong {
        color: var(--text);
        font-size: 13px;
      }

      details summary {
        color: var(--primary);
        cursor: pointer;
        font-weight: 650;
      }

      details pre {
        min-height: 120px;
        max-height: 260px;
        margin-top: 8px;
      }

      @media (max-width: 920px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div>
          <h1>LetMeFit API Test</h1>
          <div class="pill" id="statusPill">未连接</div>
        </div>
        <div class="actions">
          <button class="secondary" id="resetUserData">清空当前用户测试数据</button>
          <button class="secondary" id="resetUserDataFull">清空并重置档案</button>
          <button class="secondary" id="clearState">清空本地状态</button>
        </div>
      </div>
    </header>

    <main>
      <div class="stack">
        <section>
          <h2>连接</h2>
          <div class="grid">
            <label>
              API Base
              <input id="apiBase" value="/v1" />
            </label>
            <label>
              手机号
              <input id="phone" value="13800138000" />
            </label>
          </div>
          <div class="actions">
            <button id="health">健康检查</button>
            <button id="sendSms">发送验证码</button>
            <button id="verifySms">验证码登录</button>
          </div>
          <div class="grid" style="margin-top: 12px">
            <label>
              验证码
              <input id="code" value="123456" />
            </label>
            <label>
              Refresh Token
              <input id="refreshToken" />
            </label>
          </div>
          <div class="actions">
            <button class="secondary" id="refreshAccess">刷新 Access Token</button>
            <button class="secondary" id="logout">退出登录</button>
          </div>
        </section>

        <section>
          <h2>档案</h2>
          <div class="grid">
            <label>
              年龄
              <input id="age" type="number" value="30" />
            </label>
            <label>
              性别
              <select id="sex">
                <option value="male">male</option>
                <option value="female">female</option>
                <option value="unknown">unknown</option>
              </select>
            </label>
            <label>
              身高 cm
              <input id="heightCm" type="number" value="175" />
            </label>
            <label>
              当前体重 kg
              <input id="currentWeightKg" type="number" step="0.1" value="72.4" />
            </label>
            <label>
              目标体重 kg
              <input id="targetWeightKg" type="number" step="0.1" value="68" />
            </label>
            <label>
              目标
              <select id="goalType">
                <option value="fat_loss">fat_loss</option>
                <option value="muscle_gain">muscle_gain</option>
                <option value="maintenance">maintenance</option>
              </select>
            </label>
          </div>
          <div class="actions">
            <button id="getProfile">读取档案</button>
            <button id="saveProfile">保存档案</button>
          </div>
        </section>

        <section>
          <h2>会话与确认</h2>
          <div class="grid">
            <label>
              会话标题
              <input id="conversationTitle" value="本机测试" />
            </label>
            <label>
              Conversation ID
              <input id="conversationId" />
            </label>
          </div>
          <label style="margin-top: 12px">
            消息
            <textarea id="messageText">今天午餐吃了鸡胸肉和一碗米饭，体重72.4公斤</textarea>
          </label>
          <label class="checkbox">
            <input id="includeDebugContext" type="checkbox" checked />
            显示 LLM 上下文
          </label>
          <div class="grid" style="margin-top: 12px">
            <label>
              Pending Action ID
              <input id="pendingActionId" />
            </label>
            <label>
              查询日期
              <input id="recordDate" type="date" />
            </label>
          </div>
          <div class="actions">
            <button id="createConversation">创建会话</button>
            <button class="secondary" id="loadLatestConversation">加载最近待确认会话</button>
            <button class="secondary" id="refreshMessages">刷新消息历史</button>
            <button id="sendMessage">发送消息</button>
            <button class="secondary" id="listPending">查询动作历史</button>
            <button id="confirmPending">确认动作</button>
            <button id="confirmAllPending">确认全部待确认动作</button>
          </div>
          <div class="chat-panel">
            <div class="panel-head">
              <span class="panel-title">聊天历史</span>
              <span class="pill" id="chatCount">0 条消息</span>
            </div>
            <div class="chat-list" id="chatList">
              <div class="empty-note">创建或加载会话后显示消息历史。</div>
            </div>
          </div>
          <div class="pending-panel">
            <div class="panel-head">
              <span class="panel-title">待确认动作</span>
              <span class="pill" id="pendingCount">0 条</span>
            </div>
            <div class="pending-list" id="pendingCards">
              <div class="empty-note">发送餐食或身体指标消息后，待确认动作会显示在这里。</div>
            </div>
          </div>
        </section>

        <section>
          <h2>OSS 语音识别</h2>
          <div class="grid">
            <label>
              音频类型
              <select id="audioKind">
                <option value="meal">餐食语音</option>
                <option value="body_metric">身体指标语音</option>
              </select>
            </label>
            <label>
              MIME
              <input id="audioMime" value="audio/mp4" />
            </label>
          </div>
          <label style="margin-top: 12px">
            OSS 音频 URL
            <textarea id="audioUrl">https://fit-app-test.oss-cn-beijing.aliyuncs.com/local-test/eat.m4a</textarea>
          </label>
          <div class="actions">
            <button id="createAudioUpload">创建 OSS Upload</button>
            <button id="sendAudioMessage">发送语音消息</button>
            <button id="runAudioSmoke">一键语音测试</button>
          </div>
          <div class="grid" style="margin-top: 12px">
            <label>
              Audio File ID
              <input id="audioFileId" />
            </label>
            <label>
              语音时长秒
              <input id="audioDuration" type="number" value="10" />
            </label>
          </div>
        </section>

        <section>
          <h2>记录查询</h2>
          <div class="actions">
            <button class="secondary" id="listMeals">查询餐食</button>
            <button class="secondary" id="listBodyMetrics">查询身体指标</button>
            <button class="secondary" id="refreshArchive">查询每日归档</button>
            <button class="secondary" id="generateSummary">生成每日总结</button>
          </div>
        </section>
      </div>

      <section class="output-stack">
        <div>
          <h2>状态</h2>
          <div class="state">
            <span>Access Token</span>
            <code id="accessTokenView">未登录</code>
          </div>
        </div>
        <div class="state">
          <span>响应</span>
          <pre id="responseOutput"></pre>
        </div>
        <div class="state">
          <span>LLM 请求 body</span>
          <pre id="llmRequestOutput"></pre>
        </div>
      </section>
    </main>

    <script>
      const state = {
        accessToken: localStorage.getItem("letmefit_access_token") || "",
        refreshToken: localStorage.getItem("letmefit_refresh_token") || "",
        conversationId: localStorage.getItem("letmefit_conversation_id") || "",
        pendingActionId: localStorage.getItem("letmefit_pending_action_id") || "",
      };
      const debugTurns = [];
      const debugByAssistantMessageId = new Map();

      const $ = (id) => document.getElementById(id);

      function today() {
        return new Date().toISOString().slice(0, 10);
      }

      function updateState() {
        $("accessTokenView").textContent = state.accessToken || "未登录";
        $("refreshToken").value = state.refreshToken;
        $("conversationId").value = state.conversationId;
        $("pendingActionId").value = state.pendingActionId;
        $("statusPill").textContent = state.accessToken ? "已登录" : "未登录";
        $("statusPill").className = `pill ${state.accessToken ? "ok" : "warn"}`;
      }

      function saveTokens(data) {
        if (data.access_token) {
          state.accessToken = data.access_token;
          localStorage.setItem("letmefit_access_token", state.accessToken);
        }
        if (data.refresh_token) {
          state.refreshToken = data.refresh_token;
          localStorage.setItem("letmefit_refresh_token", state.refreshToken);
        }
        updateState();
      }

      function saveConversationId(value) {
        state.conversationId = value || "";
        if (state.conversationId) {
          localStorage.setItem("letmefit_conversation_id", state.conversationId);
        } else {
          localStorage.removeItem("letmefit_conversation_id");
        }
        updateState();
      }

      function savePendingActionId(value) {
        state.pendingActionId = value || "";
        if (state.pendingActionId) {
          localStorage.setItem("letmefit_pending_action_id", state.pendingActionId);
        } else {
          localStorage.removeItem("letmefit_pending_action_id");
        }
        updateState();
      }

      function saveAudioFileId(value) {
        $("audioFileId").value = value || "";
      }

      function includeDebugContext() {
        return $("includeDebugContext").checked;
      }

      function messagePartText(part) {
        if (!part || typeof part !== "object") {
          return String(part || "");
        }
        if (part.type === "text") {
          return part.text || "";
        }
        if (part.type === "event") {
          return part.text || part.event_type || "[event]";
        }
        if (part.type === "image") {
          return "[image]";
        }
        if (part.type === "audio") {
          return part.duration_seconds != null ? `[audio ${part.duration_seconds}s]` : "[audio]";
        }
        return `[${part.type || "content"}]`;
      }

      function contentText(content) {
        if (!Array.isArray(content)) {
          return String(content || "");
        }
        return content.map(messagePartText).filter(Boolean).join("\n");
      }

      function createElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) {
          element.className = className;
        }
        if (text !== undefined) {
          element.textContent = text;
        }
        return element;
      }

      function cacheDebugTurn(response, userText) {
        const data = response?.data;
        if (!data?.assistant_message_id) {
          return;
        }
        const turn = {
          userMessageId: data.message_id,
          assistantMessageId: data.assistant_message_id,
          userText,
          assistantText: data.assistant_text,
          response,
          createdAt: new Date().toISOString(),
        };
        debugTurns.push(turn);
        debugByAssistantMessageId.set(turn.assistantMessageId, turn);
      }

      function renderMessages(messages) {
        const list = $("chatList");
        list.innerHTML = "";
        $("chatCount").textContent = `${messages.length} 条消息`;
        if (!messages.length) {
          list.appendChild(createElement("div", "empty-note", "暂无消息。"));
          return;
        }

        for (const message of messages) {
          const item = createElement("div", `message ${message.role}`);
          const debugTurn = debugByAssistantMessageId.get(message.id);
          if (debugTurn) {
            item.classList.add("has-debug");
            item.title = "点击查看这一轮的响应和 LLM 请求 body";
            item.onclick = () => log(debugTurn.response);
          }
          item.appendChild(createElement("div", "message-role", message.role));
          item.appendChild(createElement("div", "message-text", contentText(message.content)));
          list.appendChild(item);
        }
        list.scrollTop = list.scrollHeight;
      }

      async function refreshMessages() {
        if (!$("conversationId").value) {
          renderMessages([]);
          return null;
        }
        const response = await api(`/conversations/${$("conversationId").value}/messages`);
        renderMessages(response.data.messages || []);
        return response;
      }

      function pendingTitle(action) {
        if (action.type === "create_meal_record") {
          return "餐食记录";
        }
        if (action.type === "create_body_metric_record") {
          return "身体指标";
        }
        return "待确认动作";
      }

      function pendingFields(action) {
        const payload = action.draft_payload || {};
        if (action.type === "create_meal_record") {
          const items = Array.isArray(payload.items)
            ? payload.items.map((item) => item.name || item.alias || "未命名").join("、")
            : "";
          return [
            ["餐别", payload.meal_type || "unknown"],
            ["食物", items || "待确认"],
            ["热量", payload.total_calories ?? estimateItemsTotal(payload.items, "calories")],
            ["蛋白质", payload.total_protein_g ?? estimateItemsTotal(payload.items, "protein_g")],
          ];
        }
        if (action.type === "create_body_metric_record") {
          return [
            ["体重", payload.weight_kg],
            ["体脂率", payload.body_fat_percentage],
            ["BMI", payload.bmi],
            ["记录时间", payload.recorded_at],
          ];
        }
        return [["类型", action.type]];
      }

      function estimateItemsTotal(items, key) {
        if (!Array.isArray(items)) {
          return "";
        }
        const total = items.reduce((sum, item) => sum + (Number(item?.[key]) || 0), 0);
        return total ? Number(total.toFixed(1)) : "";
      }

      function renderPendingActions(actions) {
        const list = $("pendingCards");
        list.innerHTML = "";
        $("pendingCount").textContent = `${actions.length} 条`;
        if (!actions.length) {
          list.appendChild(createElement("div", "empty-note", "暂无待确认动作。"));
          return;
        }

        for (const action of actions) {
          const card = createElement("div", "pending-card");
          const head = createElement("div", "pending-head");
          head.appendChild(createElement("div", "pending-title", pendingTitle(action)));
          head.appendChild(createElement("span", "pill", action.status));
          card.appendChild(head);

          const meta = createElement("div", "meta-row");
          meta.appendChild(createElement("span", "", `ID: ${action.pending_action_id}`));
          meta.appendChild(createElement("span", "", `confidence: ${action.confidence ?? "-"}`));
          if (action.warnings?.length) {
            meta.appendChild(createElement("span", "", `warnings: ${action.warnings.length}`));
          }
          card.appendChild(meta);

          const kvList = createElement("div", "kv-list");
          for (const [label, value] of pendingFields(action)) {
            const field = createElement("div", "kv");
            field.appendChild(createElement("div", "", label));
            field.appendChild(createElement("strong", "", value == null || value === "" ? "-" : String(value)));
            kvList.appendChild(field);
          }
          card.appendChild(kvList);

          const details = document.createElement("details");
          details.appendChild(createElement("summary", "", "查看 draft JSON"));
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(action.draft_payload || {}, null, 2);
          details.appendChild(pre);
          card.appendChild(details);

          const actionsRow = createElement("div", "actions");
          const confirm = createElement("button", "", "确认");
          confirm.onclick = () => confirmAction(action.pending_action_id);
          const discard = createElement("button", "secondary", "放弃");
          discard.onclick = () => discardAction(action.pending_action_id);
          actionsRow.appendChild(confirm);
          actionsRow.appendChild(discard);
          card.appendChild(actionsRow);
          list.appendChild(card);
        }
      }

      async function refreshPendingActions() {
        if (!$("conversationId").value) {
          renderPendingActions([]);
          return null;
        }
        const response = await api(`/conversations/${$("conversationId").value}/pending-actions`);
        const actions = response.data.pending_actions || [];
        renderPendingActions(actions);
        const pending = actions.find((action) => action.status === "pending_confirmation");
        savePendingActionId(pending?.pending_action_id || "");
        return response;
      }

      async function confirmAction(pendingActionId) {
        const response = await run(() =>
          api(`/agent/pending-actions/${pendingActionId}/confirm`, { method: "POST" }),
        );
        await refreshPendingActions();
        await refreshMessages();
        return response;
      }

      async function discardAction(pendingActionId) {
        const response = await run(() =>
          api(`/agent/pending-actions/${pendingActionId}/discard`, { method: "POST" }),
        );
        await refreshPendingActions();
        await refreshMessages();
        return response;
      }

      function log(value) {
        $("responseOutput").textContent = JSON.stringify(withoutDebugContext(value), null, 2);
        $("llmRequestOutput").textContent = JSON.stringify(extractLlmRequestBody(value), null, 2);
      }

      function extractLlmRequestBody(value) {
        const requestBody = findLlmRequestBody(value);
        if (requestBody) {
          return requestBody;
        }
        return {
          note: "本次响应没有 debug_context.llm_request_body。发送消息并勾选“显示 LLM 上下文”后会显示。",
        };
      }

      function findLlmRequestBody(value) {
        if (!value || typeof value !== "object") {
          return null;
        }
        if (value.debug_context?.llm_request_body) {
          return value.debug_context.llm_request_body;
        }
        if (Array.isArray(value)) {
          for (const item of value) {
            const found = findLlmRequestBody(item);
            if (found) {
              return found;
            }
          }
          return null;
        }
        for (const item of Object.values(value)) {
          const found = findLlmRequestBody(item);
          if (found) {
            return found;
          }
        }
        return null;
      }

      function withoutDebugContext(value) {
        if (!value || typeof value !== "object") {
          return value;
        }
        if (Array.isArray(value)) {
          return value.map((item) => withoutDebugContext(item));
        }
        return Object.fromEntries(
          Object.entries(value)
            .filter(([key]) => key !== "debug_context")
            .map(([key, item]) => [key, withoutDebugContext(item)]),
        );
      }

      function apiBase() {
        return $("apiBase").value.replace(/\/$/, "");
      }

      async function api(path, options = {}) {
        const headers = { "Content-Type": "application/json" };
        if (options.auth !== false && state.accessToken) {
          headers.Authorization = `Bearer ${state.accessToken}`;
        }
        const response = await fetch(`${apiBase()}${path}`, {
          method: options.method || "GET",
          headers,
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw { status: response.status, body };
        }
        return body;
      }

      async function run(fn) {
        try {
          const result = await fn();
          log(result);
          return result;
        } catch (error) {
          log(error);
          return null;
        }
      }

      $("health").onclick = () => run(() => api("/health", { auth: false }));

      $("sendSms").onclick = () =>
        run(() =>
          api("/auth/sms/send", {
            method: "POST",
            auth: false,
            body: { phone_number: $("phone").value, purpose: "login" },
          }),
        );

      $("verifySms").onclick = () =>
        run(async () => {
          const response = await api("/auth/sms/verify", {
            method: "POST",
            auth: false,
            body: { phone_number: $("phone").value, code: $("code").value },
          });
          saveTokens(response.data);
          return response;
        });

      $("refreshAccess").onclick = () =>
        run(async () => {
          const response = await api("/auth/refresh", {
            method: "POST",
            auth: false,
            body: { refresh_token: $("refreshToken").value || state.refreshToken },
          });
          saveTokens(response.data);
          return response;
        });

      $("logout").onclick = () =>
        run(async () => {
          const response = await api("/auth/logout", {
            method: "POST",
            auth: false,
            body: { refresh_token: $("refreshToken").value || state.refreshToken },
          });
          state.accessToken = "";
          state.refreshToken = "";
          localStorage.removeItem("letmefit_access_token");
          localStorage.removeItem("letmefit_refresh_token");
          localStorage.removeItem("letmefit_conversation_id");
          localStorage.removeItem("letmefit_pending_action_id");
          updateState();
          return response;
        });

      $("getProfile").onclick = () => run(() => api("/profile"));

      $("saveProfile").onclick = () =>
        run(() =>
          api("/profile", {
            method: "PUT",
            body: {
              age: Number($("age").value),
              sex: $("sex").value,
              height_cm: Number($("heightCm").value),
              current_weight_kg: Number($("currentWeightKg").value),
              target_weight_kg: Number($("targetWeightKg").value),
              activity_level: "moderate",
              goal_type: $("goalType").value,
            },
          }),
        );

      $("createConversation").onclick = () =>
        run(async () => {
          const response = await api("/conversations", {
            method: "POST",
            body: { title: $("conversationTitle").value },
          });
          saveConversationId(response.data.conversation_id);
          savePendingActionId("");
          renderMessages([]);
          renderPendingActions([]);
          return response;
        });

      $("loadLatestConversation").onclick = () =>
        run(async () => {
          const conversationsResponse = await api("/conversations");
          const conversations = conversationsResponse.data.conversations || [];
          let selected = conversations[0] || null;
          let pendingResponse = null;
          for (const conversation of conversations) {
            const response = await api(`/conversations/${conversation.id}/pending-actions`);
            const pending = response.data.pending_actions?.find(
              (action) => action.status === "pending_confirmation",
            );
            if (pending) {
              selected = conversation;
              pendingResponse = response;
              saveConversationId(conversation.id);
              savePendingActionId(pending.pending_action_id);
              await refreshMessages();
              renderPendingActions(response.data.pending_actions || []);
              return {
                selected_conversation: conversation,
                pending_actions: response.data.pending_actions,
              };
            }
          }
          if (selected) {
            saveConversationId(selected.id);
            pendingResponse = await api(`/conversations/${selected.id}/pending-actions`);
            await refreshMessages();
            renderPendingActions(pendingResponse.data.pending_actions || []);
          }
          return {
            selected_conversation: selected,
            pending_actions: pendingResponse?.data?.pending_actions || [],
          };
        });

      $("refreshMessages").onclick = () => run(() => refreshMessages());

      $("sendMessage").onclick = () =>
        run(async () => {
          const conversationId = $("conversationId").value;
          const userText = $("messageText").value;
          const response = await api(`/conversations/${conversationId}/messages`, {
            method: "POST",
            body: {
              content: [{ type: "text", text: userText }],
              include_debug_context: includeDebugContext(),
            },
          });
          cacheDebugTurn(response, userText);
          const action = response.data.pending_actions?.[0];
          if (action) {
            savePendingActionId(action.pending_action_id);
          }
          await refreshMessages();
          await refreshPendingActions();
          return response;
        });

      function audioPrompt() {
        if ($("audioKind").value === "body_metric") {
          return "这是一段身体指标语音，请转写并整理成待确认记录。";
        }
        return "这是一段餐食语音，请转写并整理成待确认记录。";
      }

      $("createAudioUpload").onclick = () =>
        run(async () => {
          const response = await api("/uploads", {
            method: "POST",
            body: {
              storage_provider: "oss",
              object_key: $("audioUrl").value.trim(),
              mime_type: $("audioMime").value.trim() || "audio/mp4",
              source: "microphone",
              retention_policy: "transient",
            },
          });
          saveAudioFileId(response.data.file.id);
          return response;
        });

      $("sendAudioMessage").onclick = () =>
        run(async () => {
          const conversationId = $("conversationId").value;
          const fileId = $("audioFileId").value;
          const response = await api(`/conversations/${conversationId}/messages`, {
            method: "POST",
            body: {
              include_debug_context: includeDebugContext(),
              content: [
                { type: "text", text: audioPrompt() },
                {
                  type: "audio",
                  file_id: fileId,
                  duration_seconds: Number($("audioDuration").value || 10),
                },
              ],
            },
          });
          cacheDebugTurn(response, audioPrompt());
          const action = response.data.pending_actions?.[0];
          if (action) {
            savePendingActionId(action.pending_action_id);
          }
          await refreshMessages();
          await refreshPendingActions();
          return response;
        });

      $("runAudioSmoke").onclick = () =>
        run(async () => {
          if (!$("conversationId").value) {
            const conversationResponse = await api("/conversations", {
              method: "POST",
              body: { title: "静态页 OSS 语音测试" },
            });
            saveConversationId(conversationResponse.data.conversation_id);
          }
          const uploadResponse = await api("/uploads", {
            method: "POST",
            body: {
              storage_provider: "oss",
              object_key: $("audioUrl").value.trim(),
              mime_type: $("audioMime").value.trim() || "audio/mp4",
              source: "microphone",
              retention_policy: "transient",
            },
          });
          saveAudioFileId(uploadResponse.data.file.id);

          const messageResponse = await api(`/conversations/${$("conversationId").value}/messages`, {
            method: "POST",
            body: {
              include_debug_context: includeDebugContext(),
              content: [
                { type: "text", text: audioPrompt() },
                {
                  type: "audio",
                  file_id: uploadResponse.data.file.id,
                  duration_seconds: Number($("audioDuration").value || 10),
                },
              ],
            },
          });
          cacheDebugTurn(messageResponse, audioPrompt());
          const action = messageResponse.data.pending_actions?.[0];
          if (action) {
            savePendingActionId(action.pending_action_id);
          }
          await refreshMessages();
          await refreshPendingActions();
          return {
            upload: uploadResponse.data.file,
            message: messageResponse.data,
          };
        });

      $("listPending").onclick = () =>
        run(async () => {
          return refreshPendingActions();
        });

      $("confirmPending").onclick = () =>
        confirmAction($("pendingActionId").value);

      $("confirmAllPending").onclick = () =>
        run(async () => {
          const pendingResponse = await api(
            `/conversations/${$("conversationId").value}/pending-actions`,
          );
          const pendingActions = (pendingResponse.data.pending_actions || []).filter(
            (action) => action.status === "pending_confirmation",
          );
          const confirmed = [];
          for (const action of pendingActions) {
            const response = await api(
              `/agent/pending-actions/${action.pending_action_id}/confirm`,
              { method: "POST" },
            );
            confirmed.push(response.data);
          }
          await refreshPendingActions();
          await refreshMessages();
          return { pending_count: pendingActions.length, confirmed };
        });

      $("listMeals").onclick = () => run(() => api(`/meals?date=${$("recordDate").value}`));
      $("listBodyMetrics").onclick = () =>
        run(() =>
          api(
            `/body-metrics?date_from=${$("recordDate").value}&date_to=${$("recordDate").value}`,
          ),
        );

      $("refreshArchive").onclick = () =>
        run(() => api(`/daily-archives/${$("recordDate").value}`));

      $("generateSummary").onclick = () =>
        run(() =>
          api("/summaries/generate", {
            method: "POST",
            body: { date: $("recordDate").value, timezone: "Asia/Shanghai" },
          }),
        );

      $("resetUserData").onclick = () =>
        run(async () => {
          if (!window.confirm("确认清空当前登录用户的测试业务数据？账号、登录态和档案会保留。")) {
            return { cancelled: true };
          }
          const response = await api("/dev/reset-current-user", { method: "POST" });
          saveConversationId("");
          savePendingActionId("");
          saveAudioFileId("");
          renderMessages([]);
          renderPendingActions([]);
          return response;
        });

      $("resetUserDataFull").onclick = () =>
        run(async () => {
          if (!window.confirm("确认清空当前登录用户的测试业务数据和档案？账号和登录态会保留。")) {
            return { cancelled: true };
          }
          const response = await api("/dev/reset-current-user-full", { method: "POST" });
          saveConversationId("");
          savePendingActionId("");
          saveAudioFileId("");
          renderMessages([]);
          renderPendingActions([]);
          return response;
        });

      $("clearState").onclick = () => {
        state.accessToken = "";
        state.refreshToken = "";
        state.conversationId = "";
        state.pendingActionId = "";
        localStorage.removeItem("letmefit_access_token");
        localStorage.removeItem("letmefit_refresh_token");
        localStorage.removeItem("letmefit_conversation_id");
        localStorage.removeItem("letmefit_pending_action_id");
        debugTurns.length = 0;
        debugByAssistantMessageId.clear();
        renderMessages([]);
        renderPendingActions([]);
        updateState();
        log({ cleared: true });
      };

      $("conversationId").onchange = () => {
        saveConversationId($("conversationId").value);
        run(async () => {
          await refreshMessages();
          return refreshPendingActions();
        });
      };
      $("pendingActionId").onchange = () => savePendingActionId($("pendingActionId").value);

      $("recordDate").value = today();
      updateState();
      if (state.conversationId && state.accessToken) {
        refreshMessages().catch(() => null);
        refreshPendingActions().catch(() => null);
      }
    </script>
  </body>
</html>
